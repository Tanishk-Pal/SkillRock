<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGradAnanya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="skinGradAnanya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="tagGradAnanya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="shadowAnanya" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle with Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGradAnanya)" stroke="#10B981" stroke-width="4" filter="url(#shadowAnanya)"/>
  
  <!-- Subtle Communication Icons in Backdrop -->
  <g opacity="0.18" stroke="#FFFFFF" stroke-width="2" fill="none">
    <path d="M 60 120 C 60 100, 100 100, 100 120 C 100 140, 60 150, 60 160" />
    <circle cx="60" cy="175" r="2" fill="#FFFFFF" />
    <path d="M 310 130 C 330 110, 350 140, 320 155 Z" />
    <text x="45" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#A7F3D0" font-weight="700">"Fluency"</text>
    <text x="280" y="270" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" fill="#A7F3D0" font-weight="700">"Speak Up"</text>
  </g>

  <!-- Body / Professional Blazer & Top -->
  <path d="M 80 400 C 80 280, 130 250, 200 250 C 270 250, 320 280, 320 400 Z" fill="url(#suitGrad)" />
  <!-- Inner Blouse / Top -->
  <path d="M 165 250 L 200 300 L 235 250 Z" fill="#F8FAFC" />
  <!-- Lapels -->
  <path d="M 160 250 L 195 325 L 175 350 L 140 270 Z" fill="#2E1065" />
  <path d="M 240 250 L 205 325 L 225 350 L 260 270 Z" fill="#2E1065" />

  <!-- Neck -->
  <rect x="180" y="195" width="40" height="60" rx="8" fill="#FDBA74" />
  <path d="M 180 220 C 190 235, 210 235, 220 220 Z" fill="#EA580C" opacity="0.25" />

  <!-- Head -->
  <ellipse cx="200" cy="155" rx="54" ry="66" fill="url(#skinGradAnanya)" filter="url(#shadowAnanya)"/>

  <!-- Long Hair Behind & Styling -->
  <path d="M 140 145 C 130 100, 160 70, 200 70 C 240 70, 270 100, 260 145 C 275 190, 275 270, 260 290 C 245 230, 255 160, 250 140 C 240 105, 160 105, 150 140 C 145 160, 155 230, 140 290 C 125 270, 125 190, 140 145 Z" fill="#27272A" />

  <!-- Ears -->
  <ellipse cx="145" cy="160" rx="7" ry="14" fill="#FDBA74" />
  <ellipse cx="255" cy="160" rx="7" ry="14" fill="#FDBA74" />
  <!-- Earrings -->
  <circle cx="145" cy="172" r="3" fill="#FBBF24" />
  <circle cx="255" cy="172" r="3" fill="#FBBF24" />

  <!-- Eyebrows -->
  <path d="M 168 132 Q 180 126 190 131" stroke="#27272A" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 210 131 Q 220 126 232 132" stroke="#27272A" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Eyes with Lashes -->
  <circle cx="178" cy="143" r="5" fill="#1C1917" />
  <circle cx="222" cy="143" r="5" fill="#1C1917" />
  <circle cx="180" cy="141" r="1.5" fill="#FFFFFF" />
  <circle cx="224" cy="141" r="1.5" fill="#FFFFFF" />
  <path d="M 172 138 Q 180 134 186 138" stroke="#1C1917" stroke-width="2" fill="none" />
  <path d="M 214 138 Q 220 134 228 138" stroke="#1C1917" stroke-width="2" fill="none" />

  <!-- Nose -->
  <path d="M 200 148 Q 202 161 197 166 Q 200 167 203 166" stroke="#C2410C" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Smile (Warm & Confident) -->
  <path d="M 185 182 Q 200 197 215 182" stroke="#9A3412" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M 188 184 Q 200 192 212 184" fill="#FFFFFF" />

  <!-- Verified Faculty Badge Ribbon -->
  <g transform="translate(100, 335)">
    <rect x="0" y="0" width="200" height="38" rx="19" fill="url(#tagGradAnanya)" stroke="#FFFFFF" stroke-width="2" filter="url(#shadowAnanya)" />
    <text x="100" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      ANANYA MA'AM
    </text>
  </g>
</svg>