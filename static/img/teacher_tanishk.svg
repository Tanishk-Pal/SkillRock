<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle with Glow -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="#6366F1" stroke-width="4" filter="url(#shadow)"/>
  
  <!-- Subtle Coding Tech Elements in Backdrop -->
  <g opacity="0.15" stroke="#FFFFFF" stroke-width="2" fill="none">
    <path d="M 60 120 L 90 150 L 60 180" />
    <path d="M 340 120 L 310 150 L 340 180" />
    <text x="50" y="270" font-family="monospace" font-size="20" fill="#38BDF8">def live():</text>
    <text x="260" y="270" font-family="monospace" font-size="20" fill="#38BDF8">return 100</text>
  </g>

  <!-- Body / Black PW-style Polo Shirt -->
  <path d="M 80 400 C 80 290, 130 250, 200 250 C 270 250, 320 290, 320 400 Z" fill="url(#shirtGrad)" />
  <!-- Collar -->
  <path d="M 160 250 L 200 280 L 240 250 L 225 240 L 200 260 L 175 240 Z" fill="#334155" />
  <circle cx="200" cy="295" r="3" fill="#94A3B8" />
  <circle cx="200" cy="315" r="3" fill="#94A3B8" />

  <!-- Neck -->
  <rect x="175" y="195" width="50" height="60" rx="10" fill="#EAB308" />
  <path d="M 175 220 C 185 235, 215 235, 225 220 Z" fill="#CA8A04" opacity="0.4" />

  <!-- Head -->
  <ellipse cx="200" cy="155" rx="58" ry="70" fill="url(#skinGrad)" filter="url(#shadow)"/>

  <!-- Hair (Modern Stylish Cut) -->
  <path d="M 142 145 C 135 110, 160 80, 200 80 C 245 80, 265 110, 258 145 C 255 130, 240 100, 200 100 C 160 100, 145 130, 142 145 Z" fill="#18181B" />
  <path d="M 145 130 C 160 90, 230 85, 255 105 C 240 92, 180 92, 145 130 Z" fill="#27272A" />

  <!-- Ears -->
  <ellipse cx="140" cy="160" rx="9" ry="16" fill="#F59E0B" />
  <ellipse cx="260" cy="160" rx="9" ry="16" fill="#F59E0B" />

  <!-- Eyebrows -->
  <path d="M 165 130 Q 180 124 190 130" stroke="#18181B" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M 210 130 Q 220 124 235 130" stroke="#18181B" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Eyes -->
  <circle cx="178" cy="142" r="5" fill="#18181B" />
  <circle cx="222" cy="142" r="5" fill="#18181B" />
  <circle cx="180" cy="140" r="1.5" fill="#FFFFFF" />
  <circle cx="224" cy="140" r="1.5" fill="#FFFFFF" />

  <!-- Modern Glasses (Smart Educator Look) -->
  <rect x="162" y="132" width="32" height="24" rx="7" fill="none" stroke="#0F172A" stroke-width="3.5" />
  <rect x="206" y="132" width="32" height="24" rx="7" fill="none" stroke="#0F172A" stroke-width="3.5" />
  <line x1="194" y1="142" x2="206" y2="142" stroke="#0F172A" stroke-width="3.5" />

  <!-- Nose -->
  <path d="M 200 148 Q 203 162 196 168 Q 200 170 205 168" stroke="#CA8A04" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Smile / Expression -->
  <path d="M 185 182 Q 200 198 215 182" stroke="#78350F" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <!-- Teeth highlight -->
  <path d="M 188 184 Q 200 192 212 184" fill="#FFFFFF" />

  <!-- Verified Lead Faculty Badge Ribbon -->
  <g transform="translate(100, 335)">
    <rect x="0" y="0" width="200" height="38" rx="19" fill="url(#accentGrad)" stroke="#FFFFFF" stroke-width="2" filter="url(#shadow)" />
    <text x="100" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
      TANISHK PAL SIR
    </text>
  </g>
</svg>