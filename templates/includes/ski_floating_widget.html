<!-- ==========================================================================
     SkillRock — Ski: The Grok-Inspired AI Study Partner (Floating Companion)
     ========================================================================== -->
<style>
    /* Floating Mascot Trigger Sphere */
    #ski-floating-container {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 99990;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        font-family: inherit;
    }

    @media (max-width: 768px) {
        #ski-floating-container {
            bottom: 78px;
            right: 16px;
        }
    }

    /* Floating Sphere Trigger */
    .ski-float-trigger {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #475569 0%, #1E293B 45%, #0F172A 75%, #020617 100%);
        box-shadow: 
            inset -4px -4px 10px rgba(0, 0, 0, 0.8),
            inset 3px 3px 8px rgba(255, 255, 255, 0.4),
            0 8px 24px rgba(0, 0, 0, 0.45),
            0 0 16px rgba(236, 72, 153, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
        user-select: none;
    }

    .ski-float-trigger:hover {
        transform: scale(1.1) translateY(-3px);
        box-shadow: 
            inset -4px -4px 10px rgba(0, 0, 0, 0.8),
            inset 3px 3px 10px rgba(255, 255, 255, 0.5),
            0 14px 30px rgba(0, 0, 0, 0.5),
            0 0 24px rgba(236, 72, 153, 0.6);
    }

    .ski-float-trigger:active {
        transform: scale(0.94);
    }

    /* Miniature Eyes inside trigger */
    .ski-mini-eyes {
        display: flex;
        gap: 6px;
        transition: transform 0.08s ease-out;
    }

    .ski-mini-eye {
        width: 5px;
        height: 14px;
        background: #FFFFFF;
        border-radius: 9999px;
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.9);
        transform-origin: center center;
        transform: rotate(-10deg);
        transition: transform 0.12s ease;
    }

    .ski-mini-eye.blinking {
        transform: scaleY(0.08) rotate(-10deg) !important;
    }

    /* Floating Tooltip Pill */
    .ski-float-tooltip {
        position: absolute;
        right: 68px;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #F8FAFC;
        padding: 6px 14px;
        border-radius: 9999px;
        font-size: 0.78rem;
        font-weight: 700;
        white-space: nowrap;
        backdrop-filter: blur(8px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .ski-float-tooltip::after {
        content: "";
        position: absolute;
        right: -6px;
        top: 50%;
        transform: translateY(-50%);
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
        border-left: 6px solid rgba(15, 23, 42, 0.92);
    }

    .ski-float-trigger:hover .ski-float-tooltip {
        opacity: 1;
        visibility: visible;
        transform: translateY(-50%) translateX(-4px);
    }

    /* Companion Popup Window */
    .ski-popup-window {
        position: absolute;
        bottom: 70px;
        right: 0;
        width: 360px;
        max-width: calc(100vw - 32px);
        height: 500px;
        max-height: calc(100vh - 130px);
        background: var(--bg-card, #0F172A);
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 30px rgba(236, 72, 153, 0.15);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        transform: translateY(20px) scale(0.95);
        transform-origin: bottom right;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        backdrop-filter: blur(12px);
    }

    .ski-popup-window.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
    }

    /* Popup Top Bar */
    .ski-pop-header {
        padding: 14px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(15, 23, 42, 0.6);
    }

    .ski-pop-header-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .ski-pop-mini-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #475569, #0F172A);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .ski-pop-title {
        font-size: 0.92rem;
        font-weight: 800;
        color: var(--text-main, #F8FAFC);
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .ski-pop-badge {
        font-size: 0.65rem;
        font-weight: 800;
        padding: 2px 7px;
        border-radius: 9999px;
        background: linear-gradient(135deg, #EC4899, #8B5CF6);
        color: #FFFFFF;
        text-transform: uppercase;
        letter-spacing: 0.04em;
    }

    .ski-pop-actions {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .ski-pop-btn {
        background: transparent;
        border: none;
        color: var(--text-secondary, #94A3B8);
        width: 30px;
        height: 30px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
    }

    .ski-pop-btn:hover {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-main, #F8FAFC);
    }

    /* Popup Messages Body */
    .ski-pop-body {
        flex: 1;
        overflow-y: auto;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .ski-bubble {
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 0.86rem;
        line-height: 1.45;
        max-width: 88%;
        animation: skiFadeIn 0.2s ease;
    }

    @keyframes skiFadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .ski-bubble.user {
        background: #6366F1;
        color: #FFFFFF;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
    }

    .ski-bubble.bot {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--text-main, #F8FAFC);
        align-self: flex-start;
        border-bottom-left-radius: 4px;
    }

    /* Quick Chips Bar */
    .ski-pop-chips {
        padding: 4px 14px 10px;
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scrollbar-width: none;
    }
    .ski-pop-chips::-webkit-scrollbar { display: none; }

    .ski-mini-chip {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-secondary, #94A3B8);
        font-size: 0.72rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 9999px;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s ease;
    }

    .ski-mini-chip:hover {
        background: rgba(236, 72, 153, 0.15);
        color: #F472B6;
        border-color: rgba(236, 72, 153, 0.35);
    }

    /* Popup Footer Form */
    .ski-pop-footer {
        padding: 10px 14px 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(15, 23, 42, 0.5);
    }

    .ski-pop-input-row {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 4px 6px 4px 12px;
    }

    .ski-pop-input-row:focus-within {
        border-color: #EC4899;
        box-shadow: 0 0 0 2px rgba(236, 72, 153, 0.2);
    }

    .ski-pop-input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-main, #F8FAFC);
        font-size: 0.88rem;
    }

    .ski-pop-send-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        border: none;
        background: linear-gradient(135deg, #EC4899, #8B5CF6);
        color: #FFFFFF;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s ease;
    }

    .ski-pop-send-btn:hover {
        transform: scale(1.08);
    }
</style>

<div id="ski-floating-container">

    <!-- The Popup Companion Window -->
    <div class="ski-popup-window" id="skiPopupWindow" role="dialog" aria-label="Ski Companion">
        <!-- Top bar -->
        <div class="ski-pop-header">
            <div class="ski-pop-header-left">
                <div class="ski-pop-mini-avatar">
                    <span style="font-size: 13px;">🤖</span>
                </div>
                <div>
                    <div class="ski-pop-title">
                        <span>Ski</span>
                        <span class="ski-pop-badge">GROK PARTNER</span>
                    </div>
                </div>
            </div>
            <div class="ski-pop-actions">
                <a href="{{ url_for('ai.ski_hub') }}" class="ski-pop-btn" title="Open Fullscreen Ski Hub">
                    <i data-lucide="maximize-2" style="width: 14px; height: 14px;"></i>
                </a>
                <button type="button" class="ski-pop-btn" onclick="toggleSkiPopup()" title="Close">
                    <i data-lucide="x" style="width: 15px; height: 15px;"></i>
                </button>
            </div>
        </div>

        <!-- Chat messages log -->
        <div class="ski-pop-body" id="skiPopBody">
            <div class="ski-bubble bot">
                Hey! I'm <strong>Ski</strong>, your round, witty AI study buddy. Procrastinating? Stuck on a bug? Hit a button below or talk to me! ⚡
            </div>
        </div>

        <!-- Quick prompt chips -->
        <div class="ski-pop-chips">
            <button class="ski-mini-chip" onclick="quickPopPrompt('Hype me up!')">🔥 Hype Me</button>
            <button class="ski-mini-chip" onclick="quickPopPrompt('Roast my procrastination!')">🧠 Roast Me</button>
            <button class="ski-mini-chip" onclick="quickPopPrompt('Tell me a dev joke')">😂 Joke</button>
            <button class="ski-mini-chip" onclick="quickPopPrompt('2-minute study hack')">💡 Focus</button>
        </div>

        <!-- Input footer -->
        <div class="ski-pop-footer">
            <form class="ski-pop-input-row" onsubmit="handlePopSubmit(event)">
                <input 
                    type="text" 
                    id="skiPopInput" 
                    class="ski-pop-input" 
                    placeholder="Ask Ski anything..." 
                    autocomplete="off"
                >
                <button type="submit" class="ski-pop-send-btn" title="Send">
                    <i data-lucide="send" style="width: 13px; height: 13px;"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Floating Sphere Trigger Button -->
    <div class="ski-float-trigger" id="skiFloatTrigger" onclick="toggleSkiPopup()" title="Ski — Your AI Study Companion">
        <div class="ski-mini-eyes" id="skiMiniEyes">
            <div class="ski-mini-eye left"></div>
            <div class="ski-mini-eye right"></div>
        </div>
        <div class="ski-float-tooltip">
            <span>⚡ Meet Ski • AI Companion</span>
        </div>
    </div>

</div>

<script>
(function() {
    const trigger = document.getElementById('skiFloatTrigger');
    const popup = document.getElementById('skiPopupWindow');
    const miniEyes = document.getElementById('skiMiniEyes');
    const popBody = document.getElementById('skiPopBody');
    const popInput = document.getElementById('skiPopInput');

    let isOpen = false;

    window.toggleSkiPopup = function() {
        isOpen = !isOpen;
        if (popup) {
            popup.classList.toggle('active', isOpen);
            if (isOpen && popInput) {
                setTimeout(() => popInput.focus(), 150);
            }
        }
    };

    // Eye Tracking on Floating Trigger
    document.addEventListener('mousemove', function(e) {
        if (!miniEyes || !trigger) return;
        const rect = trigger.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;

        const deltaX = e.clientX - centerX;
        const deltaY = e.clientY - centerY;
        const dist = Math.hypot(deltaX, deltaY);
        const angle = Math.atan2(deltaY, deltaX);
        const maxOffset = 5;

        const offX = Math.cos(angle) * Math.min(dist * 0.04, maxOffset);
        const offY = Math.sin(angle) * Math.min(dist * 0.04, maxOffset);

        miniEyes.style.transform = `translate(${offX}px, ${offY}px)`;
    });

    // Random Blinking
    function blinkMiniEyes() {
        const eyes = document.querySelectorAll('.ski-mini-eye');
        eyes.forEach(e => e.classList.add('blinking'));
        setTimeout(() => {
            eyes.forEach(e => e.classList.remove('blinking'));
        }, 130);
        setTimeout(blinkMiniEyes, Math.random() * 3500 + 2500);
    }
    setTimeout(blinkMiniEyes, 2500);

    window.quickPopPrompt = function(text) {
        if (popInput) {
            popInput.value = text;
            handlePopSubmit(new Event('submit'));
        }
    };

    window.handlePopSubmit = async function(e) {
        if (e && e.preventDefault) e.preventDefault();
        const text = (popInput ? popInput.value : '').trim();
        if (!text) return;

        popInput.value = '';

        // Add user message
        appendPopMsg('user', text);

        try {
            const res = await fetch('/api/ski/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, mood: 'grok' })
            });
            const data = await res.json();
            const reply = (data && data.reply) ? data.reply : "Keep crushing those commits, chief!";
            appendPopMsg('bot', reply);
        } catch(err) {
            appendPopMsg('bot', "Network glitch! But my motivation for you is 100% intact. Keep coding!");
        }
    };

    function appendPopMsg(sender, text) {
        if (!popBody) return;
        const div = document.createElement('div');
        div.className = `ski-bubble ${sender}`;
        div.innerText = text;
        popBody.appendChild(div);
        popBody.scrollTop = popBody.scrollHeight;
    }
})();
</script>
