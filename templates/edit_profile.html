{% extends "base.html" %}

{% block title %}Edit Profile — Skill Rock{% endblock %}

{% block content %}
<div style="max-width: 540px; margin: 20px auto;">
    <div class="card" style="padding: 28px;">
        <div class="page-header" style="margin-bottom: 20px;">
            <h1 class="page-title" style="font-size: 1.5rem;">Edit Profile</h1>
            <p class="page-subtitle">Update your student information.</p>
        </div>

        <form action="{{ url_for('profile.edit_profile') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">College / University</label>
                <input type="text" name="college" class="form-control" value="{{ user.college }}" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label class="form-label">Course / Branch</label>
                    <input type="text" name="branch" class="form-control" value="{{ user.branch }}" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Academic Year</label>
                    <select name="year" class="form-select">
                        <option value="1st Year" {% if user.year == '1st Year' %}selected{% endif %}>1st Year</option>
                        <option value="2nd Year" {% if user.year == '2nd Year' %}selected{% endif %}>2nd Year</option>
                        <option value="3rd Year" {% if user.year == '3rd Year' %}selected{% endif %}>3rd Year</option>
                        <option value="4th Year" {% if user.year == '4th Year' %}selected{% endif %}>4th Year</option>
                        <option value="Postgraduate" {% if user.year == 'Postgraduate' %}selected{% endif %}>Postgraduate</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Bio</label>
                <textarea name="bio" class="form-control" rows="3" placeholder="Briefly describe your interests...">{{ user.bio }}</textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;">
                <a href="{{ url_for('profile.profile') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
